name: Release localizations

on:
  push:
    branches: [main]
    paths: ["Catalog/**", "Localizations/**", "release-locales.txt", "tools/**", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-manifest.py
      - run: gh release delete latest --yes || true
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: gh release create latest out/assets/* out/manifest.json --title "Latest localizations" --latest
        env: { GH_TOKEN: "${{ github.token }}" }
